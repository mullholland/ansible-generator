---

# Settings to Docker containers.
docker_namespace: mullholland
docker_image: debian
docker_tag: latest

# Your username on Galaxy.
galaxy_namespace: mullholland

# Your username/organization name on GitHub.
github_namespace: mullholland

# Your username/group on GitLab.
gitlab_namespace: mullholland-github-mirror

# Your name and optionally email-address.
author: Mullholland (mullholland)

# The full URL to your website.
author_website: "https://mullholland.net"

# The container to use for GitLab CI.
gitlab_container: "robertdebock/github-action-molecule:6.0.1"

# Molecule is run directly on the GitHub-hosted runner (pip-installed, not
# via a third-party action) so we control the ansible-core/collection
# versions instead of inheriting whatever a molecule action bundles.
molecule_python_version: "3.14"
molecule_pip_requirements:
  - "ansible==14.3.1"
  - "ansible-core==2.21.3"
  - "molecule==26.8.0"
  - "molecule-plugins[docker]==26.7.15"
  - "docker==7.2.0"
